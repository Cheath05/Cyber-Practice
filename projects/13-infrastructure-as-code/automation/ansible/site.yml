---
# Baseline for every lab Linux host, then role-specific setup.
# Run:  ansible-playbook site.yml --check --diff   then   ansible-playbook site.yml
# Package installs need internet: enable the TARGETS TEMP egress rule while this runs.
- name: Security baseline for all lab hosts
  hosts: all_lab
  vars:
    ufw_allowed_ports: ["22"]
  tasks:
    - name: Install baseline packages
      ansible.builtin.apt:
        name: [ufw, auditd, unattended-upgrades, qemu-guest-agent]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Harden SSH via a drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-lab-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          X11Forwarding no
          MaxAuthTries 3
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

    - name: Enable unattended security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    - name: Login banner
      ansible.builtin.copy:
        dest: /etc/issue.net
        content: "Authorized lab use only. Activity is logged.\n"
        mode: "0644"

    - name: UFW allow required ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ ufw_allowed_ports + (extra_ufw_ports | default([])) }}"

    - name: UFW default deny incoming and enable
      community.general.ufw:
        state: enabled
        direction: incoming
        policy: deny

    - name: Ensure auditd and the guest agent are running
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [auditd, qemu-guest-agent]

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

- name: Docker hosts
  hosts: docker_hosts
  vars:
    extra_ufw_ports: ["80", "3000", "4280"]
  tasks:
    - name: Install Docker from Ubuntu packages
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
        state: present

    - name: Docker running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Open target app ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ extra_ufw_ports }}"

