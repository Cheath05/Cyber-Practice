# aeacus scoring config for the Project 05 Windows practice image (answer key - keep private).
# Docs: checks.md, securitypolicy.md, userproperties.md in the aeacus repo.
name = "cp-windows-practice-1"
title = "Homelab CyberPatriot Windows Round 1"
os = "Windows 11 Enterprise"
user = "labadmin"
local = true
version = "2.1.1"

[[check]]
message = "Removed unauthorized user helpdesk2"
points = 6
    [[check.pass]]
    type = "UserExistsNot"
    user = "helpdesk2"

[[check]]
message = "jlee is no longer an administrator"
points = 5
    [[check.pass]]
    type = "UserInGroupNot"
    user = "jlee"
    group = "Administrators"

[[check]]
message = "Guest account disabled"
points = 4
    [[check.pass]]
    type = "SecurityPolicy"
    key = "EnableGuestAccount"
    value = "0"

[[check]]
message = "Minimum password length is at least 10"
points = 4
    [[check.pass]]
    type = "SecurityPolicy"
    key = "MinimumPasswordLength"
    value = "10-24"

[[check]]
message = "Maximum password age between 30 and 90 days"
points = 3
    [[check.pass]]
    type = "SecurityPolicy"
    key = "MaximumPasswordAge"
    value = "30-90"

[[check]]
message = "Account lockout threshold configured"
points = 3
    [[check.pass]]
    type = "SecurityPolicy"
    key = "LockoutBadCount"
    value = "3-10"

[[check]]
message = "Logon auditing enabled (success and failure)"
points = 4
    [[check.pass]]
    type = "CommandContains"
    cmd = 'auditpol /get /subcategory:"Logon"'
    value = "Success and Failure"

[[check]]
message = "Windows Firewall enabled on all profiles"
points = 5
    [[check.pass]]
    type = "FirewallUp"

[[check]]
message = "RDP requires Network Level Authentication"
points = 5
    [[check.pass]]
    type = "RegistryKey"
    key = 'HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp\UserAuthentication'
    value = "1"

[[check]]
message = "SMBv1 disabled"
points = 5
    [[check.pass]]
    type = "WindowsFeatureNot"
    name = "SMB1Protocol"

[[check]]
message = "Removed world-writable share Files"
points = 5
    [[check.pass]]
    type = "ShareExistsNot"
    name = "Files"

[[check]]
message = "Remote Registry service disabled"
points = 4
    [[check.pass]]
    type = "ServiceStartup"
    name = "RemoteRegistry"
    value = "disabled"

[[check]]
message = "Removed persistence scheduled task"
points = 5
    [[check.pass]]
    type = "ScheduledTaskExistsNot"
    name = "Updater"

[[check]]
message = "Removed Run-key persistence"
points = 5
    [[check.pass]]
    type = "RegistryKeyExistsNot"
    key = 'SOFTWARE\Microsoft\Windows\CurrentVersion\Run\OneDriveHelper'

[[check]]
message = "Removed Defender exclusion"
points = 5
    [[check.pass]]
    type = "CommandContainsNot"
    cmd = '(Get-MpPreference).ExclusionPath'
    value = 'C:\Users\Public'

[[check]]
message = "UAC prompts administrators for consent"
points = 4
    [[check.pass]]
    type = "RegistryKeyNot"
    key = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ConsentPromptBehaviorAdmin'
    value = "0"

[[check]]
message = "LM hashes are not stored"
points = 3
    [[check.pass]]
    type = "RegistryKey"
    key = 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa\NoLMHash'
    value = "1"

[[check]]
message = "Anonymous SAM enumeration restricted"
points = 3
    [[check.pass]]
    type = "RegistryKey"
    key = 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RestrictAnonymousSAM'
    value = "1"

[[check]]
message = "Removed prohibited media file"
points = 2
    [[check.pass]]
    type = "PathExistsNot"
    path = 'C:\Users\Public\Music\leaked_album.mp3'

[[check]]
message = "Removed plaintext password file"
points = 3
    [[check.pass]]
    type = "PathExistsNot"
    path = 'C:\Users\labadmin\Desktop\passwords.txt'

[[check]]
message = "Forensic Question 1 correct"
points = 4
    [[check.pass]]
    type = "FileContainsRegex"
    path = 'C:\Users\labadmin\Desktop\Forensic Question 1.txt'
    value = '(?m)^ANSWER:\s*Updater\s*$'

[[check]]
message = "Forensic Question 2 correct"
points = 4
    [[check.pass]]
    type = "FileContainsRegex"
    path = 'C:\Users\labadmin\Desktop\Forensic Question 2.txt'
    value = '(?mi)^ANSWER:\s*C:\\Users\\Public\\?\s*$'

[[check]]
message = "Forensic Question 3 correct"
points = 4
    [[check.pass]]
    type = "FileContainsRegex"
    path = 'C:\Users\labadmin\Desktop\Forensic Question 3.txt'
    value = '(?mi)^ANSWER:\s*helpdesk2\s*$'

# ---- Penalties ----
[[check]]
message = "Authorized service account svc_print was removed"
points = -8
    [[check.pass]]
    type = "UserExistsNot"
    user = "svc_print"

[[check]]
message = "Remote Desktop (a required service) was disabled"
points = -8
    [[check.pass]]
    type = "RegistryKey"
    key = 'HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\fDenyTSConnections'
    value = "1"
