# aeacus scoring config for the Project 04 practice image (answer key - keep private).
# Check types: https://github.com/elysium-suite/aeacus/blob/master/docs/checks.md
# Set `version` to the aeacus version you downloaded (./aeacus version).
name = "cp-linux-practice-1"
title = "Homelab CyberPatriot Practice Round 1"
os = "Ubuntu 24.04"
user = "labadmin"
local = true
version = "2.1.1"

[[check]]
message = "Removed hidden root-equivalent account svcadm"
points = 8
    [[check.pass]]
    type = "UserExistsNot"
    user = "svcadm"

[[check]]
message = "Removed passwordless sudo rule"
points = 6
    [[check.pass]]
    type = "DirContainsNot"
    path = "/etc/sudoers.d/"
    value = "NOPASSWD"

[[check]]
message = "Disabled root login over SSH"
points = 6
    [[check.passoverride]]
    type = "PathExistsNot"
    path = "/etc/ssh/sshd_config.d/99-weak.conf"
    [[check.passoverride]]
    type = "FileContainsNot"
    path = "/etc/ssh/sshd_config.d/99-weak.conf"
    value = "PermitRootLogin yes"

[[check]]
message = "User operator has a password set"
points = 5
    [[check.pass]]
    type = "FileContainsNot"
    path = "/etc/shadow"
    value = "operator::"

[[check]]
message = "Maximum password age is 90 days or less"
points = 4
    [[check.pass]]
    type = "FileContainsRegex"
    path = "/etc/login.defs"
    value = '^PASS_MAX_DAYS\s+([1-9]|[1-8][0-9]|90)\s*$'

[[check]]
message = "Firewall enabled"
points = 5
    [[check.pass]]
    type = "FirewallUp"

[[check]]
message = "/etc/passwd is not world-writable"
points = 6
    [[check.pass]]
    type = "PermissionIsNot"
    path = "/etc/passwd"
    value = "????????w?"

[[check]]
message = "Removed malicious cron job"
points = 6
    [[check.pass]]
    type = "PathExistsNot"
    path = "/etc/cron.d/0update-check"

[[check]]
message = "Removed profile.d persistence script"
points = 5
    [[check.pass]]
    type = "PathExistsNot"
    path = "/etc/profile.d/zz-maint.sh"

[[check]]
message = "Unauthorized user guest is not an administrator"
points = 5
    [[check.pass]]
    type = "UserInGroupNot"
    user = "guest"
    group = "sudo"
    [[check.passoverride]]
    type = "UserExistsNot"
    user = "guest"

[[check]]
message = "Automatic update checks enabled"
points = 4
    [[check.pass]]
    type = "AutoCheckUpdatesEnabled"

[[check]]
message = "IPv4 forwarding disabled"
points = 4
    [[check.pass]]
    type = "FileContainsNot"
    path = "/etc/sysctl.conf"
    value = "net.ipv4.ip_forward=1"

[[check]]
message = "Rogue sysmon service stopped"
points = 6
    [[check.pass]]
    type = "ServiceUpNot"
    name = "sysmon"

[[check]]
message = "Removed SUID bit from backup-helper"
points = 8
    [[check.passoverride]]
    type = "PathExistsNot"
    path = "/usr/local/bin/backup-helper"
    [[check.passoverride]]
    type = "PermissionIsNot"
    path = "/usr/local/bin/backup-helper"
    value = "???s??????"

[[check]]
message = "Forensic Question 1 correct"
points = 6
    [[check.pass]]
    type = "FileContainsRegex"
    path = "/home/labadmin/Desktop/Forensic Question 1.txt"
    value = '^ANSWER:\s*svcadm\s*$'

[[check]]
message = "Forensic Question 2 correct"
points = 6
    [[check.pass]]
    type = "FileContainsRegex"
    path = "/home/labadmin/Desktop/Forensic Question 2.txt"
    value = '^ANSWER:\s*4444\s*$'

[[check]]
message = "Forensic Question 3 correct"
points = 6
    [[check.pass]]
    type = "FileContainsRegex"
    path = "/home/labadmin/Desktop/Forensic Question 3.txt"
    value = '^ANSWER:.*CYBERPATIO'

# ---- Penalties ----
[[check]]
message = "Authorized user webmaster was removed"
points = -10
    [[check.pass]]
    type = "UserExistsNot"
    user = "webmaster"

[[check]]
message = "Critical service SSH is not running"
points = -10
    [[check.pass]]
    type = "ServiceUpNot"
    name = "ssh"
